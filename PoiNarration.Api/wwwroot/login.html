<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Poi Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }

        h2 {
            color: #6200ee;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #6200ee;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }

            button:hover {
                background: #4b00d1;
            }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Poi Login</h2>
        <input type="text" id="username" placeholder="Tài khoản (admin/owner1)">
        <input type="password" id="password" placeholder="Mật khẩu">
        <button onclick="handleLogin()">ĐĂNG NHẬP</button>
    </div>

    <script>
        async function handleLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            // Sếp nhớ kiểm tra cổng 7115 có đúng cổng API của sếp không nhé!
            const res = await fetch('https://localhost:7115/api/account/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });

            if (res.ok) {
                const data = await res.json();
                // Lưu quyền và tên để dùng cho admin.html
                localStorage.setItem('userRole', data.role);
                localStorage.setItem('userFullName', data.fullName);

                alert("Đăng nhập thành công sếp ơi!");
                window.location.href = 'admin.html';
            } else {
                alert("Sai tài khoản hoặc mật khẩu rồi!");
            }
        }
    </script>
</body>
</html>
